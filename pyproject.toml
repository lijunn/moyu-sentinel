[project]
name = "moyu-sentinel"
version = "0.1.0"
description = "基于本地 AI 的 macOS 老板接近预警工具"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "LiJun" }]
license = "MIT"
dependencies = [
    "lap>=0.5.12,<1",
    "numpy>=1.26,<3",
    "opencv-python>=4.10,<5",
    "pyobjc-framework-AVFoundation>=10.3,<13",
    "pyobjc-framework-Quartz>=10.3,<13",
    "PySide6>=6.8,<7",
    "ultralytics>=8.3,<9",
]

[project.urls]
Repository = "https://github.com/lijunn/moyu-sentinel"
Issues = "https://github.com/lijunn/moyu-sentinel/issues"

[project.scripts]
moyu-sentinel = "moyu_sentinel.app:main"

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moyu_sentinel"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

